# DakotaAC messages (English defaults)
# Use & color codes. Every message can be customized or set to an empty string.
# Placeholder names appear inside {braces}; keep names needed by your template.
# The prefix can be inserted in any template with {prefix}.
# /dac reload applies changes without restarting the server.
# Check display names are independent of module identifiers in config.yml.

prefix: '&8[&cDakotaAC&8] &7'
common:
  enabled: '&aENABLED'
  disabled: '&cDISABLED'
  'on': '&aON'
  'off': '&cOFF'
system:
  started: 'DakotaAC v{version}: {active}/{total} checks active.'
  stopped: DakotaAC has stopped.
  staff-started: '&aDakotaAC started. All configured checks loaded.'
  staff-degraded: '&cSome configured checks could not start. Run /dac status and check the console.'
  missing-protocollib: ProtocolLib is missing or disabled. Install a ProtocolLib build that supports your Paper version.
  invalid-setting: Invalid configuration value at {path}; using the bundled default.
  component-error: '{component} encountered a compatibility/runtime error: {error}'
  check-unavailable: The {check} check could not start. Other checks will continue; see /dac status.
commands:
  no-permission: '{prefix}&cYou do not have permission to use this command.'
  help: '{prefix}Available commands: &c/dakotaac <{commands}>'
  unknown: '{prefix}&cUnknown command.'
  reload-success: '{prefix}&aConfiguration, messages, thresholds, and check tasks reloaded.'
  reload-failed: '{prefix}&cReload failed. Check the console and correct config.yml or lang.yml.'
  check-usage: '{prefix}&cUsage: /dakotaac check <ModuleName>'
  check-unknown: '{prefix}&cModule ''{module}'' does not exist.'
  check-toggle: '{prefix}Module &e{module} &7is now {state}.'
  auto-kick-toggle: '{prefix}Auto-Kick is now {state}.'
  auto-ban-toggle: '{prefix}Auto-Ban is now {state}.'
  notifications-toggle: '{prefix}AntiCheat notifications are now {state}.'
  flag-usage: '{prefix}&cUsage: /dakotaac flag <KickLimit> <BanLimit>'
  flag-invalid: '{prefix}&cKick limit must be at least 1, and Ban limit must be higher than Kick limit.'
  flag-updated: '{prefix}&aPunishment thresholds updated: kick at &e{kick}&a, ban at &e{ban}&a flags.'
  flag-number: '{prefix}&cPlease enter valid whole numbers.'
status:
  header: '{prefix}&e--- DakotaAC Status ---'
  version: '{prefix}Version: &b{version}'
  authors: '{prefix}Authors: &b{authors}'
  environment: '{prefix}Server: &b{server} &7| ProtocolLib: &b{protocollib}'
  notifications: '{prefix}Notifications: {state}'
  auto-kick: '{prefix}Auto-Kick: {state}'
  auto-ban: '{prefix}Auto-Ban: {state}'
  kick-limit: '{prefix}Kick Limit: &b{limit} &7flags'
  ban-limit: '{prefix}Ban Limit: &b{limit} &7flags'
  active: '{prefix}Active Modules: &b{active}/{total}'
  unavailable: '{prefix}&cUnavailable checks: {checks}'
  errors: '{prefix}Runtime errors since the last configuration load: &e{errors}'
  healthy: '{prefix}&aConfigured checks loaded; no runtime errors recorded.'
  degraded: '{prefix}&cProtection is degraded. Inspect the console diagnostics.'
alerts:
  console: '{prefix}&e{player} &7was flagged for &c{hack} &8(&7{details}&8)'
  staff: '{prefix}&e{player} &7is suspected of &c{hack} &8(&7{details}&8)'
punishments:
  reason: '&c&lDakotaAC Security


    &7You have been automatically removed from the server.

    &7Reason: &c{hack}

    &7Details: &8{details}'
  ban-broadcast: '{prefix}&c{player} &7was banned for &c{hack}&7.'
  kick-broadcast: '{prefix}&c{player} &7was kicked for &c{hack}&7.'
reports:
  usage: '&cUsage: /report <player>'
  admin-usage: '&cUsage: /report <player> or /report info'
  not-online: '&cThat player is not online!'
  self: '&cYou cannot report yourself!'
  cooldown: '&cPlease wait {seconds} seconds before reporting again.'
  staff: '{prefix}&e{reporter} &7has reported &c{player}&7!'
  total: '{prefix}Total reports for this player: &c{count}'
  sent: '&aYour report has been sent to the online staff!'
  antibot: '{prefix}&4⚠ &c{player} has accumulated {count} total reports! Triggering AntiBot module...'
  only-player: '&cOnly players can open the report book!'
  no-permission: '&cYou do not have permission to view reports.'
  empty: '{prefix}&aThere are currently no reports in the database.'
  book-title: '&cReport Database'
  book-author: DakotaAC
  book-header: '&0&lDAKOTA AC

    &8Report Database

    &8&m===================


    '
  book-entry: "&8» &0&l{name}\n   &8➥ &7Reports: &c{count}\n\n"
  unknown-player: Unknown
