Settings:
  # Enable or disable in-game violation alerts for staff members.
  # Players with the 'dakotaac.alerts' permission will receive these.
  Notifications: true

  # Should the system automatically kick a player if they reach the max kick flags?
  Auto-Kick: true

  # Should the system automatically ban a player if they reach the max ban flags?
  Auto-Ban: true

  # How many violations (flags) a player must accumulate to trigger an automatic kick.
  Max-Kick-Flags: 800

  # How many violations (flags) a player must accumulate to trigger an automatic ban.
  Max-Ban-Flags: 2000

