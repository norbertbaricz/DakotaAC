# DakotaAC configuration (English)
# Existing Settings.* and Modules.<Check>.enabled keys are preserved.
# All bundled thresholds retain the original project defaults.
# Time values explicitly end in -ms or -ticks where the original setting has a unit.
# /dac reload applies config.yml, lang.yml, thresholds, listeners, and repeating tasks.
# Missing keys are added automatically; existing custom values are retained.
# Module controls:
#   cancel-events: cancel offending packets/Bukkit events.
#   setbacks: teleport suspicious movement back to a safe position.
#   enforce-actions: apply extra actions such as fall damage or resetting sprint.
#   flag-enabled: record and announce detections.
#   flag-weight: violation points per detection (1 preserves the original behavior).
#   punish: allow this check's detections to trigger global kick/ban thresholds.
#   bypass-permission: empty disables bypass; otherwise exempts that permission.
# Messages and flag display names belong in lang.yml.

# Global alert and punishment switches. Flag totals survive reconnects and /dac reload, until restart.
Settings:
  Notifications: true
  Auto-Kick: true
  Auto-Ban: true
  Max-Kick-Flags: 800
  Max-Ban-Flags: 2000

# Visible, rate-limited diagnostics. Unknown layouts are reported instead of silently ignored.
Compatibility:
  Error-Log-Interval-Ms: 30000
  Print-Stack-Traces: false

# Administrative access. Alert permission is configured under Alerts.notify-permission.
Permissions:
  admin: dakotaac.admin

# Staff and console alerts share a per-player cooldown; violation totals do not.
Alerts:
  notify-permission: dakotaac.notification
  alert-cooldown-ms: 3000
  console: true

# Console ban command supports {player}, {hack}, and {details}. Set it empty to skip command execution.
Punishments:
  ban-command: ban {player} [DakotaAC] {hack} - {details}
  broadcast-kicks: true
  broadcast-bans: true

# Lifecycle alerts and optional sound names use Minecraft namespaced sound keys without minecraft:.
Staff-Notifications:
  enabled: true
  sounds: true
  error:
    sound: block.note_block.bass
    volume: 1.0
    pitch: 0.5
  success:
    sound: entity.experience_orb.pickup
    volume: 1.0
    pitch: 1.0

# Report counts remain in the first world persistent data container, as in the original project.
Reports:
  reports-needed-for-antibot: 3
  report-cooldown-ms: 60000
  players-per-book-page: 3
  max-book-pages: 100

