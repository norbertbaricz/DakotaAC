name: DakotaAC
version: '0.19'
main: skypixel.dakotaAC
description: Configurable anti-cheat for modern Paper servers.
api-version: '1.21.11'
authors: [MaxUltimat3]
website: https://modrinth.com/plugin/dakotaac
load: POSTWORLD
depend: [ProtocolLib]
softdepend: [ViaVersion]
commands:
  dakotaac:
    description: Manage DakotaAC and inspect compatibility status.
    usage: /dakotaac
    aliases: [dac, anticheat]
  report:
    description: Report a suspicious player or view the report database.
    usage: /report <player>
permissions:
  dakotaac.command:
    description: Reserved command permission for existing installations.
    default: op
  dakotaac.admin:
    description: Manage checks, reload settings, and inspect reports.
    default: op
  dakotaac.notification:
    description: Receive violation alerts.
    default: op
  dakotaac.alerts:
    description: Legacy alias for the alert permission.
    default: op
    children:
      dakotaac.notification: true
  dakotaac.bypass.vpn:
    description: Bypass the VPN lookup.
    default: op
